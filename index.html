
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N3R 420</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f5f5f5; }
.navbar { background:#ee4d2d !important; }
.sidebar { background:white; padding:15px; border-radius:10px; }
.product-card { border:none; border-radius:10px; transition:0.2s; }
.product-card:hover { transform:translateY(-5px); box-shadow:0 5px 20px rgba(0,0,0,0.1); }
.price { color:#ee4d2d; font-weight:bold; }
.badge-sale { background:red; position:absolute; top:10px; left:10px; }
.wishlist { position:absolute; top:10px; right:10px; cursor:pointer; }
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar p-3">
  <div class="container d-flex justify-content-between align-items-center">
    <h4 class="text-white">N3R 420</h4>
    <input class="form-control w-50" placeholder="Search products..." onkeyup="searchProduct(this.value)">
    <div>
      <button class="btn btn-light" onclick="openWishlist()">Favorite </button>
      </button>
      <button class="btn btn-light" onclick="openCart()">🛒 (<span id="count">0</span>)</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row">

    <!-- SIDEBAR CATEGORY -->
    <div class="col-md-3">
      <div class="sidebar">
        <h5>Categories</h5>
        <ul class="list-group">
          <li class="list-group-item" onclick="filter('All')">All</li>
          <li class="list-group-item" onclick="filter('Fashion')">Fashion</li>
          <li class="list-group-item" onclick="filter('Electronics')">Electronics</li>
          <li class="list-group-item" onclick="filter('Accessories')">Accessories</li>
        </ul>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="col-md-9">
      <div class="row" id="product-list"></div>
    </div>

  </div>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal" id="detailModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h4 id="d-name"></h4>
      <img id="d-img" class="img-fluid">
      <p id="d-price" class="price"></p>
      <button class="btn btn-danger" onclick="addToCart(currentIndex)">Add to Cart</button>
    </div>
  </div>
</div>

<!-- CART -->
<div class="modal" id="cartModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h4>Cart</h4>
      <ul id="cart-list"></ul>
      <h5 id="total"></h5>
    </div>
  </div>
</div>

<!-- WISHLIST -->
<div class="modal" id="wishModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h4>Wishlist</h4>
      <ul id="wish-list"></ul>
    </div>
  </div>
</div>

<script>

let products = [
  {name:"Sneakers", price:45, cat:"Fashion", image:"https://plaeto.in/cdn/shop/files/6_7a114088-22ad-4100-97c0-0f76434ba20b.jpg?v=1754980278&width=2000"},
  {name:"T-Shirt", price:20, cat:"Fashion", image:"https://midwaysports.com/cdn/shop/files/NikeMen_sPrimaryT-Shirt_Stock_8.png?v=1761210001"},
  {name:"Headphones", price:60, cat:"Electronics", image:"https://kh.jbl.com/dw/image/v2/AAUJ_PRD/on/demandware.static/-/Sites-masterCatalog_Harman/default/dwb856560e/JBL_E55BT_KEY_BLACK_6175_FS_x1-1605x1605px.png?sw=537&sfrm=png"},
  {name:"Smart Watch", price:80, cat:"Electronics", image:"https://www.apple.com/newsroom/images/product/watch/standard/Apple_watch-series7_hero_09142021_big.jpg.slideshow-medium_2x.jpg"},
  {name:"Backpack", price:25, cat:"Accessories", image:"https://badworkwear.com.au/cdn/shop/files/bad-everyday-backpack-bag-715639.jpg?v=1739083257"},
  {name:"Cap", price:10, cat:"Accessories", image:"https://colorfulstandard.com/cdn/shop/files/CS6010_Male_OrganicCottonCap-DeepBlack_2_19ff1aee-3baa-4093-ab92-dcb114b0fbfa.jpg?v=1738186435&width=3000"},
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let wishlist = JSON.parse(localStorage.getItem("wish")) || [];
let currentIndex = 0;

function renderProducts(list=products){
  let html="";
  list.forEach((p,i)=>{
    html += `
    <div class="col-md-4 mb-4">
      <div class="card product-card position-relative">
        <span class="badge badge-sale text-white">SALE</span>
        <span class="wishlist" onclick="addWishlist(${i})">❤️</span>
        <img src="${p.image}" class="card-img-top" onclick="showDetail(${i})">
        <div class="card-body">
          <h6>${p.name}</h6>
          <p class="price">$${p.price}</p>
          <button class="btn btn-danger w-100" onclick="addToCart(${i})">Add</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById("product-list").innerHTML = html;
}

function addToCart(i){
  cart.push(products[i]);
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
}

function addWishlist(i){
  wishlist.push(products[i]);
  localStorage.setItem("wish", JSON.stringify(wishlist));
}

function updateCart(){
  document.getElementById("count").innerText = cart.length;
}

function openCart(){
  let list=""; let total=0;
  cart.forEach(item=>{
    list += `<li>${item.name} - $${item.price}</li>`;
    total += item.price;
  });
  document.getElementById("cart-list").innerHTML=list;
  document.getElementById("total").innerText="Total: $"+total;
  document.getElementById("cartModal").style.display="block";
}

function openWishlist(){
  let list="";
  wishlist.forEach(item=>{
    list += `<li>${item.name} - $${item.price}</li>`;
  });
  document.getElementById("wish-list").innerHTML=list;
  document.getElementById("wishModal").style.display="block";
}

function showDetail(i){
  currentIndex = i;
  let p = products[i];
  document.getElementById("d-name").innerText=p.name;
  document.getElementById("d-img").src=p.image;
  document.getElementById("d-price").innerText="$"+p.price;
  document.getElementById("detailModal").style.display="block";
}

function filter(cat){
  if(cat=="All") return renderProducts();
  renderProducts(products.filter(p=>p.cat==cat));
}

function searchProduct(text){
  let result = products.filter(p=>p.name.toLowerCase().includes(text.toLowerCase()));
  renderProducts(result);
}

renderProducts();
updateCart();

</script>

<div class="modal" id="checkoutModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h4>Checkout</h4>

      <input class="form-control mb-2" placeholder="Full Name" id="c-name">
      <input class="form-control mb-2" placeholder="Phone Number" id="c-phone">
      <input class="form-control mb-2" placeholder="Address" id="c-address">

      <h6 class="mt-3">Payment Method</h6>
      <select class="form-select mb-3" id="payment-method">
        <option value="cod">Cash on Delivery</option>
        <option value="card">Credit/Debit Card</option>
        <option value="aba">ABA Pay</option>
      </select>

      <!-- CARD UI -->
      <div id="card-box" style="display:none">
        <input class="form-control mb-2" placeholder="Card Number">
        <input class="form-control mb-2" placeholder="Expiry (MM/YY)">
        <input class="form-control mb-2" placeholder="CVV">
      </div>

      <!-- ABA UI -->
      <div id="aba-box" style="display:none" class="text-center">
        <p>Scan QR to pay</p>
        <img src="" />
      </div>

      <h5 id="checkout-total"></h5>

      <button class="btn btn-danger w-100 mt-3" onclick="placeOrder()">Place Order</button>
    </div>
  </div>
</div>

<script>

// UPDATE openCart to include checkout button
const oldOpenCart = openCart;
openCart = function(){
  oldOpenCart();
  document.getElementById("cart-list").innerHTML += '<br><button class="btn btn-success w-100" onclick="openCheckout()">Checkout</button>';
}

function openCheckout(){
  let total = 0;
  cart.forEach(i=> total += i.price);
  document.getElementById("checkout-total").innerText = "Total: $" + total;
  document.getElementById("checkoutModal").style.display = "block";
}

// Payment switch UI

document.addEventListener("change", function(e){
  if(e.target.id === "payment-method"){
    let val = e.target.value;
    document.getElementById("card-box").style.display = val === "card" ? "block" : "none";
    document.getElementById("aba-box").style.display = val === "aba" ? "block" : "none";
  }
});

function placeOrder(){
  alert("Order placed successfully! (Demo only)");
  cart = [];
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
  document.getElementById("checkoutModal").style.display = "none";
}

</script>

</body>
</html>
